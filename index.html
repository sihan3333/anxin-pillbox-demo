<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>安心药箱 · 让异地的你知道爸妈吃药了</title>
<link rel="stylesheet" href="demo.css">
</head>
<body>
<header class="top">
  <div>
    <h1>💊 安心药箱</h1>
    <p>到点提醒爸妈吃什么、在哪、怎么吃；吃完自动告诉你。没吃，才需要你打电话。</p>
  </div>
  <nav><a href="product.html" target="_blank">产品说明</a><a href="review.html" target="_blank">验证复盘</a><a href="v1.html" target="_blank">旧版</a></nav>
</header>

<section id="guide" class="guide" aria-live="polite"></section>

<section class="stage">
  <div class="phone-col">
    <div class="phone-label">👵 妈妈的手机</div>
    <div class="phone" id="parentPhone"><div class="screen" id="parent"></div></div>
  </div>
  <div class="phone-col">
    <div class="phone-label">👩 你的手机（女儿）</div>
    <div class="phone" id="childPhone"><div class="screen" id="child"></div></div>
  </div>
</section>

<footer>演示说明：药品均为虚构示例；响铃、短信、电话都是在网页里模拟的，不会真的发送。“已吃”是妈妈本人或电话确认的记录，不能证明药真的吞下。</footer>

<script src="src/extract.js"></script>
<script src="demo.js"></script>
</body>
</html>
